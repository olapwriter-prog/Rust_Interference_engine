[package]
name = "rie-server"
description = "OpenAI-compatible, llama-server-compatible HTTP server for the Rust Inference Engine with grammar-constrained tool calling and online reinforcement learning"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rie-server"
path = "src/main.rs"

[features]
default = []
gpu = ["dep:rie-gpu"]

[dependencies]
rie-core = { workspace = true }
rie-gpu = { workspace = true, optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
